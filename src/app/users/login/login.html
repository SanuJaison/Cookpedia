<div class="container">
  <div style="background: url()" class="row align-items-center">
    <div class="col-lg-2"></div>
    <div class="col-lg-6 text-center">
      <h1>Login</h1>
      <p>More than 100</p>
      <form
        [formGroup]="loginForm"
        (ngSubmit)="handleLogin()"
        style="background-color: rgba(0, 0, 0, 0.3)"
        class="border rounded shadow p-5 mt-5"
      >
        <div class="text-center mb-3 text-light">
          <h3>CookPiedia</h3>
        </div>
        <div class="text-center mb-3 text-light">
          <input
            name="email"
            formControlName="email"
            type="email"
            placeholder="Enter ur email"
            class="form-control"
          />
        </div>
        @if (loginForm.get('email')?.errors && loginForm.get('email')?.touched) {
          <p class="text-danger">Inavild Email</p>
        }
        <div class="text-center mb-3 text-light">
          <input
            name="password"
            formControlName="password"
            type="password"
            placeholder="Enter ur Password"
            class="form-control"
          />
        </div>
        @if (loginForm.get('password')?.errors && loginForm.get('password')?.touched) {
          <p class="text-danger">Inavild Password</p>
        }
        <button class="btn btn-primary">Login</button>
        <p class="my-3">Are You a New user? <span routerLink="/register">Register</span></p>
      </form>
    </div>
    <div class="col-lg-2"></div>
  </div>
</div>
